<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class and ID Selectors</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <p><div id="number-one">Number 1 - I'm one ID.</div></p>
    <p><div id="number-two">Number 2 - I'm one ID.</div></p>
    <p><div id="number-three">Number 3 - I'm another ID.</div></p>
    <p class="cool-class">Number 4 - I'm a class, but cooler!</p>
    <p id="number-five" class="a-class">Number 5 - I'm a class!</p>
  </body>
</html>
